name: sos_connect
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+6

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_easyloading: ^3.0.5
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  calendar_date_picker2: ^2.0.1
  http: ^1.6.0
  toastification: ^3.1.0
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  dartx: ^1.2.0
  skeletonizer: ^2.1.3
  flutter_html: ^3.0.0
  universal_html: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  phone_numbers_parser: ^9.0.21
  pin_code_fields: ^8.0.1
  vietnam_provinces: ^2.0.0
  dismissible_page: ^1.0.2
  smooth_page_indicator: ^1.2.1
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  flutter_map_marker_cluster: ^8.2.2
  device_info_plus: ^13.2.0
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: any
  build_runner: any
  injectable_generator:
  retrofit_generator:
  flutter_gen_runner:
  auto_route_generator:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/logo_app/
    - .env

  fonts:
    - family: SFUIDisplayRegular
      fonts:
        - asset: assets/fonts/SF-UI-Display-Regular.ttf

    - family: SFUIDisplayBold
      fonts:
        - asset: assets/fonts/SF-UI-Display-Bold.otf

flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true
